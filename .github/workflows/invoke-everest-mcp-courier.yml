name: Invoke Everest MCP courier
on:
  push:
    paths:
      - ".github/workflows/invoke-everest-mcp-courier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger temporary deployment courier
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             "https://nsydorjhwuanyrvmintc.supabase.co/functions/v1/netlify-courier-mcp-v5?k=everest-v5-20260924-6d91f3c84a"
